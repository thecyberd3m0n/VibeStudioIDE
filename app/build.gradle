plugins {
    id 'com.android.application'
}

// Release signing: env vars (CI) take precedence over the git-ignored keystore.properties (local).
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def signingValue = { String envName, String propName ->
    System.getenv(envName) ?: keystoreProps.getProperty(propName)
}
def releaseStoreFile = signingValue('RELEASE_KEYSTORE_FILE', 'storeFile')
def releaseStorePassword = signingValue('RELEASE_KEYSTORE_PASSWORD', 'storePassword')
def releaseKeyAlias = signingValue('RELEASE_KEY_ALIAS', 'keyAlias')
def releaseKeyPassword = signingValue('RELEASE_KEY_PASSWORD', 'keyPassword')
def hasReleaseSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it }

android {
    namespace 'com.vibestudio.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.vibestudio.app"
        minSdk 26
        targetSdk 28
        versionCode 8
        versionName "0.1.4"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }

        ndk {
            abiFilters "arm64-v8a", "x86_64", "armeabi-v7a", "x86"
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            } else {
                logger.warn("WARNING: release keystore not configured (RELEASE_KEYSTORE_* env or keystore.properties); " +
                        "release APK will be signed with the debug key.")
                signingConfig signingConfigs.debug
            }
        }
    }
    packagingOptions {
        pickFirst 'lib/*/libtermux.so'
        jniLibs {
            useLegacyPackaging true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint {
        // targetSdk 28 is intentional (W^X exec restrictions on API 29+, see PROOT_FOR_SDK_29.md)
        disable 'ExpiredTargetSdkVersion'
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.customview:customview-poolingcontainer:1.0.0'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'io.modelcontextprotocol.sdk:mcp:2.0.0'
    implementation 'io.github.rosemoe:editor:0.24.6'
    implementation 'io.github.rosemoe:language-textmate:0.24.6'

    implementation project(':core')
    implementation project(':terminal-view')
    implementation project(':bootstrap-arm64')
    implementation project(':bootstrap-arm')
    implementation project(':bootstrap-x86_64')
    implementation project(':bootstrap-x86')
    
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'androidx.test:core:1.5.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
