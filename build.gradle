// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    alias libs.plugins.android.application apply false
    alias libs.plugins.android.library apply false
    // Applied by :core and the :bootstrap-* siblings; must be on the root
    // classpath so they share one plugin class loader (shared build service).
    alias libs.plugins.maven.publish apply false
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

subprojects {
    // Lets Eclipse JDT / VS Code Java see Android module sources; no effect on builds.
    apply from: rootProject.file('gradle/eclipse-ide.gradle')

    afterEvaluate { project ->
        if (project.path.startsWith(":bootstrap-")) {
            if (project.extensions.findByName("android") != null) {
                project.android.namespace = "com.libtermux.bootstrap." + project.name.replace("-", "_")
            }
        }
    }
}
