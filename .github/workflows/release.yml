name: Release

# Builds a signed release APK whenever a version tag (vX.Y.Z) is pushed and
# attaches it to a GitHub Release. The APK is always signed with the same
# keystore, provided through repository secrets (see README "Releasing").

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & publish signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          BASE_VERSION="${VERSION%%-*}"
          GRADLE_VERSION=$(grep -E 'versionName\s+"[^"]+"' app/build.gradle | head -n 1 | cut -d'"' -f2)
          echo "tag=${TAG}"                 >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}"         >> "$GITHUB_OUTPUT"
          echo "base_version=${BASE_VERSION}" >> "$GITHUB_OUTPUT"
          if [ "$VERSION" != "$BASE_VERSION" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$BASE_VERSION" != "$GRADLE_VERSION" ]; then
            echo "::error::Tag ${TAG} does not match versionName \"${GRADLE_VERSION}\" in app/build.gradle. Bump versionName/versionCode first."
            exit 1
          fi

      - name: Check signing secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$RELEASE_KEYSTORE_BASE64" ]   || missing="$missing RELEASE_KEYSTORE_BASE64"
          [ -n "$RELEASE_KEYSTORE_PASSWORD" ] || missing="$missing RELEASE_KEYSTORE_PASSWORD"
          [ -n "$RELEASE_KEY_ALIAS" ]         || missing="$missing RELEASE_KEY_ALIAS"
          [ -n "$RELEASE_KEY_PASSWORD" ]      || missing="$missing RELEASE_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (see README 'Releasing')."
            exit 1
          fi

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify signature & prepare artifacts
        id: artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | grep -v unsigned | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No signed release APK found in app/build/outputs/apk/release/"
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner
          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERTS"
          if echo "$CERTS" | grep -q "Android Debug"; then
            echo "::error::Release APK is signed with the debug key — release signing config was not applied."
            exit 1
          fi
          mkdir -p dist
          OUT="dist/VibeStudio-${VERSION}.apk"
          cp "$APK" "$OUT"
          (cd dist && sha256sum "VibeStudio-${VERSION}.apk" > "VibeStudio-${VERSION}.apk.sha256")
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        env:
          BASE_VERSION: ${{ steps.version.outputs.base_version }}
        run: |
          awk -v ver="$BASE_VERSION" '
            /^## \[/ { in_section = index($0, "## [" ver "]") == 1 }
            in_section { print }
          ' CHANGELOG.md > dist/RELEASE_NOTES.md
          if [ ! -s dist/RELEASE_NOTES.md ]; then
            echo "::warning::No CHANGELOG.md section found for ${BASE_VERSION}; using auto-generated notes."
            echo "generate_notes=true" >> "$GITHUB_ENV"
          else
            echo "generate_notes=false" >> "$GITHUB_ENV"
          fi
          cat dist/RELEASE_NOTES.md

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibeStudio-${{ steps.version.outputs.version }}
          path: |
            dist/*.apk
            dist/*.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: VibeStudio ${{ steps.version.outputs.version }}
          tag_name: ${{ steps.version.outputs.tag }}
          body_path: dist/RELEASE_NOTES.md
          generate_release_notes: ${{ env.generate_notes == 'true' }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          files: |
            dist/*.apk
            dist/*.sha256
