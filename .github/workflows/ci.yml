name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Debug build & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 ndk;28.2.13676358 cmake;3.22.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # TODO: add `./gradlew :app:testDebugUnitTest` once app/src/test compiles under Gradle
      # (GitConflictParsingTest has a bad static import; OnboardingActivityTest references R.id.step4_layout).

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VibeStudio-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
